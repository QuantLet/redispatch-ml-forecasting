# ── Directories ────────────────────────────────────────────────────────────
output_dir: "/home/jovyan/redispatch-ml-forecasting/outputs_paper"
eval_dir: "/home/jovyan/redispatch-ml-forecasting/outputs_paper/evaluation"
checkpoint_selection: "best"

# ── Forecast ───────────────────────────────────────────────────────────────
forecast_horizon: 24
input_size: 24

# ── Target shift ───────────────────────────────────────────────────────────
shift_hours: 6

# ── Date range ─────────────────────────────────────────────────────────────
train_start: "2021-10-01"
valid_start: "2024-11-01"
test_start:  "2025-01-01"

# ── Wandb ──────────────────────────────────────────────────────────────────
wandb_project: "redispatch-forecasting-proper"
persist_checkpoints: true
checkpoint_compression: 21
checkpoint_compression_n_threads: 30

# ── Training hyper-parameters ──────────────────────────────────────────────
max_steps:           5000
val_check_steps:       50
early_stop_patience:   20
batch_size:            16
windows_batch_size:    64
learning_rate:       1.0e-4
random_seed:          778
local_scaler_type:    "standard"

# ── Rolling-window settings ────────────────────────────────────────────────
n_train_months: 37
n_valid_months:  2
n_test_months:   1

# ── Models to train ────────────────────────────────────────────────────────
models:
  - nbeatsx
  - nhits
  - tft
  - lstm

nbeatsx:
  n_blocks: [1, 1, 1]
  stack_types: ["identity", "seasonality", "trend"]
  learning_rate: 5.0e-5

nhits:
  n_blocks: [1, 1, 1]

tft:
  hidden_size: 64
  dropout: 0.15
  n_head: 4
  attn_dropout: 0.1

lstm:
  encoder_hidden_size: 32
  encoder_n_layers: 2
  encoder_dropout: 0.2
  decoder_hidden_size: 128
  decoder_layers: 2

# ── Per-TSO overrides ──────────────────────────────────────────────────────
# TSO is read from the dataset's companion JSON metadata (the "operator" field).
# Both "TenneT DE" (with space) and "TenneT_DE" (underscore) are accepted.
#
# Precedence: CLI flag > TSO override > global value above > hardcoded default.
# Flat keys (input_size, shift_hours, models, …) replace the global value.
# Model sections are deep-merged with the global section: only specified keys
# are overridden, the rest are inherited from the global model section above.

tso_overrides:
  TenneT_DE:
    input_size: 24
    tft:
      hidden_size: 128
      dropout: 0.15

  50Hertz:
    input_size: 24
    nbeatsx:
      n_blocks: [15, 5, 2]
    tft:
      hidden_size: 64
      dropout: 0.2
    lstm:
      encoder_hidden_size: 128
      encoder_dropout: 0.1

  Amprion:
    input_size: 24
    tft:
      hidden_size: 32
      dropout: 0.15

  TransnetBW:
    input_size: 24
    nhits:
      n_blocks: [20, 15, 10]
    tft:
      hidden_size: 64
      dropout: 0.1
    lstm:
      encoder_hidden_size: 64
      encoder_dropout: 0.2
